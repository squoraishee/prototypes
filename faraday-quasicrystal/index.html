<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Faraday Quasicrystal</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c10;
        color: #e8e6df;
        font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #toggle {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 2;
      }
      #panel {
        display: none;
        position: fixed;
        left: 16px;
        top: 16px;
        width: 280px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 14px 16px 12px;
        background: rgba(14, 17, 24, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        font-size: 13px;
        user-select: none;
      }
      #panel.open {
        display: block;
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }
      #panel .hint {
        margin: 0 0 10px;
        color: #8d93a0;
        line-height: 1.45;
      }
      #panel label {
        display: block;
        margin: 10px 0 4px;
        color: #b9bec9;
      }
      #panel label output {
        float: right;
        font-variant-numeric: tabular-nums;
        color: #e8e6df;
      }
      #panel input[type="range"],
      #panel select {
        width: 100%;
      }
      #panel .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: #b9bec9;
      }
      #panel .check input {
        margin: 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        background: #1d2330;
        color: #e8e6df;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 5px 9px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #262e3f;
      }
      button.on {
        border-color: #7fd1b9;
        color: #7fd1b9;
      }
      #panel .readout {
        margin-top: 12px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 6px;
        color: #b9bec9;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
      }
      #panel .foot {
        margin-top: 10px;
        color: #6b7280;
        font-size: 12px;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        padding: 24px;
        text-align: center;
        line-height: 1.5;
        color: #d9a3a3;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <button id="toggle">Controls</button>

    <div id="panel">
      <h1>Faraday Quasicrystal</h1>
      <p class="hint">
        A vibrated fluid forms standing waves. The forcing frequency sets the wavelength, and the number of wave directions sets the symmetry.
      </p>

      <div class="row" id="presets"></div>

      <label for="f1">Forcing frequency <output id="f1Out"></output></label>
      <input id="f1" type="range" min="6" max="24" step="0.1" />

      <label for="n1">Wave directions <output id="n1Out"></output></label>
      <input id="n1" type="range" min="2" max="6" step="1" />

      <label class="check"><input id="second" type="checkbox" /> Second forcing frequency</label>

      <label for="f2">Second frequency <output id="f2Out"></output></label>
      <input id="f2" type="range" min="6" max="24" step="0.1" />

      <label for="n2">Second wave directions <output id="n2Out"></output></label>
      <input id="n2" type="range" min="2" max="6" step="1" />

      <label for="phase">Relative phase <output id="phaseOut"></output></label>
      <input id="phase" type="range" min="0" max="6.2832" step="0.01" />

      <label for="amp">Amplitude <output id="ampOut"></output></label>
      <input id="amp" type="range" min="0.2" max="1" step="0.01" />

      <label for="speed">Speed <output id="speedOut"></output></label>
      <input id="speed" type="range" min="0" max="3" step="0.05" />

      <label for="palette">Palette</label>
      <select id="palette">
        <option value="ink">Ink</option>
        <option value="ember">Ember</option>
        <option value="lagoon">Lagoon</option>
      </select>

      <div class="row">
        <button id="pause">Pause</button>
      </div>

      <div class="readout" id="readout"></div>

      <div class="foot">C toggles this panel. Space pauses.</div>
    </div>

    <div id="error"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
