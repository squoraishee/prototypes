<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Photon Ring</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #e8e6df;
        font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #toggle {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 2;
      }
      #panel {
        display: none;
        position: fixed;
        left: 16px;
        top: 16px;
        width: 290px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 14px 16px 12px;
        background: rgba(12, 14, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        font-size: 13px;
        user-select: none;
        z-index: 3;
      }
      #panel.open {
        display: block;
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }
      #panel .hint {
        margin: 0 0 10px;
        color: #8d93a0;
        line-height: 1.45;
      }
      #panel label {
        display: block;
        margin: 10px 0 4px;
        color: #b9bec9;
      }
      #panel label output {
        float: right;
        font-variant-numeric: tabular-nums;
        color: #e8e6df;
      }
      #panel input[type="range"],
      #panel select {
        width: 100%;
      }
      #panel .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: #b9bec9;
      }
      #panel .check input {
        margin: 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        background: #1d2330;
        color: #e8e6df;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 5px 9px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #262e3f;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      button.on {
        border-color: #f2b86b;
        color: #f2b86b;
      }
      #panel .readout {
        margin-top: 12px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 6px;
        color: #b9bec9;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        white-space: pre-line;
      }
      #panel .foot {
        margin-top: 10px;
        color: #6b7280;
        font-size: 12px;
      }
      #story {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: min(420px, calc(100vw - 32px));
        padding: 14px 16px 12px;
        background: rgba(12, 14, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        line-height: 1.5;
        z-index: 1;
      }
      #story.hidden {
        display: none;
      }
      #story .step {
        color: #f2b86b;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #story h2 {
        margin: 4px 0 6px;
        font-size: 17px;
        font-weight: 600;
      }
      #story p {
        margin: 0;
        color: #c4c9d2;
        font-size: 14px;
      }
      #story .row {
        justify-content: space-between;
        align-items: center;
      }
      #story .hint {
        color: #6b7280;
        font-size: 12px;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        padding: 24px;
        text-align: center;
        line-height: 1.5;
        color: #d9a3a3;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <button id="toggle">Controls</button>

    <div id="story">
      <div class="step" id="storyStep"></div>
      <h2 id="storyTitle"></h2>
      <p id="storyBody"></p>
      <div class="row">
        <button id="prev">Back</button>
        <span class="hint">C opens controls</span>
        <button id="next">Next</button>
      </div>
    </div>

    <div id="panel">
      <h1>Photon Ring</h1>
      <p class="hint">
        Light around a spinning black hole, traced with the Kerr geodesic equations.
      </p>

      <div class="row" id="targets"></div>

      <label for="spin">Spin <output id="spinOut"></output></label>
      <input id="spin" type="range" min="0" max="0.998" step="0.001" />

      <label for="incl">Viewing angle <output id="inclOut"></output></label>
      <input id="incl" type="range" min="0" max="90" step="0.5" />

      <label for="fov">Field of view <output id="fovOut"></output></label>
      <input id="fov" type="range" min="10" max="60" step="0.5" />

      <label class="check"><input id="disk" type="checkbox" /> Accretion disk</label>

      <label for="rin">Inner disk radius <output id="rinOut"></output></label>
      <input id="rin" type="range" min="1.5" max="12" step="0.05" />

      <label for="rout">Outer disk radius <output id="routOut"></output></label>
      <input id="rout" type="range" min="8" max="40" step="0.5" />

      <label for="diskSpeed">Disk rotation <output id="speedOut"></output></label>
      <input id="diskSpeed" type="range" min="0" max="1" step="0.01" />

      <label class="check"><input id="grid" type="checkbox" /> Background grid</label>

      <label for="exposure">Exposure <output id="expOut"></output></label>
      <input id="exposure" type="range" min="0.2" max="3" step="0.05" />

      <label for="palette">Palette</label>
      <select id="palette">
        <option value="ember">Ember</option>
        <option value="ink">Ink</option>
        <option value="lagoon">Lagoon</option>
      </select>

      <div class="row">
        <button id="pause">Pause</button>
      </div>

      <div class="readout" id="readout"></div>

      <div class="foot">C toggles this panel. Space pauses. Units: M = GM/c², the hole's gravitational radius scale.</div>
    </div>

    <div id="error"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
